# VPN Seller — the shop plus, depending on the server, one way in from outside.
#
# install.sh picks the mode and writes it to .env as COMPOSE_PROFILES:
#
#   caddy   own Caddy on ports 80/443 with an automatic certificate
#           (a clean server with a domain)
#   tunnel  a temporary Cloudflare tunnel, no domain needed; its address
#           changes when the tunnel restarts and the shop follows it itself
#   (empty) no proxy of its own: an existing Caddy/nginx on the server
#           reaches the shop — install.sh writes docker-compose.override.yml
#
# and, next to one of those, the database:
#
#   postgres  PostgreSQL instead of the built-in SQLite (a bigger shop);
#             install.sh adds it on install or when the panel asks to move
#
# By hand:  cp .env.example .env  (fill it in)  &&  docker compose up -d

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/vpn.db}
    volumes:
      - ./data:/app/data
    # Never published to the internet: only a proxy reaches it. Forwarded
    # addresses are believed only from private networks anyway (Dockerfile,
    # app/auth.py), so the login rate limit cannot be dodged with a made-up
    # X-Forwarded-For.
    expose:
      - "8000"
    networks:
      default:
        aliases: [vpnshop-app]

  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    depends_on: [app]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://app:8000

  # PostgreSQL instead of the built-in SQLite. install.sh turns it on
  # (COMPOSE_PROFILES gets ",postgres") and writes to .env:
  #   POSTGRES_PASSWORD=…
  #   DATABASE_URL=postgresql+psycopg://vpn:…@vpnseller-db:5432/vpn
  # The shop reaches it by an alias of its own: on a network shared with
  # another project's proxy a plain "db" could be someone else's database.
  db:
    image: postgres:16-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: vpn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: vpn
    # Sized for a small VPS next to the shop: about 100 MB of memory.
    command: postgres -c shared_buffers=64MB -c max_connections=100 -c work_mem=4MB
      -c maintenance_work_mem=32MB -c effective_cache_size=256MB
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn -d vpn"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases: [vpnseller-db]

volumes:
  caddy_data:
  caddy_config:
  pg_data:
