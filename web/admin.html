<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin</title>
<link rel="icon" href="/favicon.ico">
<!-- Opened from the bot, the panel signs the admin in with Telegram. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  /* The same system as the mini app, with the same values: true black,
     cards barely lighter, one amber accent. Text colours are checked
     for contrast. */
  --bg:#000000; --surface:#0C0D0F; --surface2:#131519; --surface3:#191C21; --surface4:#22252B;
  --brd:#22252B; --brd2:#2A2E37;
  --txt:#F2F4F8; --muted:#A2A8B6; --muted2:#787F8E;
  --accent:#F2B441; --accent-rgb:242,180,65; --accent-weak:rgba(var(--accent-rgb),.13); --accent-brd:rgba(var(--accent-rgb),.45);
  --on-accent:#221802;
  --ok:#5BD6A0; --ok-weak:rgba(91,214,160,.13);
  --warn:#F2B441; --warn-weak:rgba(var(--accent-rgb),.14);
  --danger:#EC6A56; --danger-weak:rgba(236,106,86,.13);
  --r:13px;
  --font-d:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-b:"Golos Text",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--txt);font-variant-numeric:tabular-nums;
  font-family:var(--font-b);font-size:14px;-webkit-font-smoothing:antialiased;position:relative}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(680px 420px at 14% -10%,rgba(var(--accent-rgb),.06),transparent 62%)}
.layout{position:relative;z-index:1;display:flex;min-height:100vh}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:6px;border:2px solid var(--bg)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;flex:0 0 auto}
.ic.s{width:16px;height:16px}.ic.xs{width:14px;height:14px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
h1,h2,.h{font-family:var(--font-d);font-weight:500;letter-spacing:-.01em}

/* ============ SIDEBAR ============ */
.side{width:240px;flex:0 0 240px;border-right:1px solid var(--brd);position:sticky;top:0;height:100vh;
  overflow-y:auto;background:var(--bg);display:flex;flex-direction:column;padding:14px 11px}
.logo{display:flex;align-items:center;gap:11px;padding:5px 7px 16px}
.logo .m{width:34px;height:34px;border-radius:9px;background:var(--accent);flex:none;
  display:grid;place-items:center;color:var(--on-accent)}
.logo .m .ic{width:19px;height:19px;stroke-width:1.9}
.m.haslogo{background:none !important;overflow:hidden}
.m.haslogo img{width:100%;height:100%;object-fit:contain;display:block}
.th{border:1px solid var(--brd);border-radius:12px;padding:10px;background:var(--surface2);cursor:pointer;text-align:left;color:var(--txt);font:inherit}
.th:hover{border-color:var(--brd2)}
.th.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.th .sw{height:46px;border-radius:8px;display:flex;align-items:flex-end;gap:6px;padding:8px;margin-bottom:8px;border:1px solid rgba(255,255,255,.06)}
.th .sw i{width:26px;height:10px;border-radius:5px;display:block}
.th .sw u{width:10px;height:10px;border-radius:50%;display:block;opacity:.55}
.th b{font-size:12.5px}
.logobox{display:flex;gap:16px;align-items:center}
.logobox .pv{width:72px;height:72px;border-radius:16px;border:1px dashed var(--brd2);display:grid;place-items:center;overflow:hidden;background:var(--surface2);flex:none}
.logobox .pv img{width:100%;height:100%;object-fit:contain}
.pvs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pvc{border-radius:14px;padding:16px;border:1px solid var(--brd)}
.pvc .o{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.pvc h4{margin:6px 0 12px;font-family:var(--font-d);font-weight:500;font-size:19px}
.pvc .b{display:inline-flex;padding:9px 14px;border-radius:10px;font-weight:700;font-size:13px}
.pvc .l{display:inline-block;margin-left:12px;font-weight:600;font-size:13px}
.colorrow{display:flex;gap:10px;align-items:center}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.th.fnt .fs{display:block;font-size:22px;font-weight:500;line-height:1.2;margin-bottom:6px;color:var(--txt)}
.lrow{display:grid;grid-template-columns:1fr 1fr 1.6fr auto;gap:8px;margin-bottom:8px}
.lrow input{width:100%;background:var(--surface2);border:1px solid var(--brd);border-radius:9px;padding:9px 10px;color:var(--txt);font:inherit;font-size:13px}
@media(max-width:640px){.lrow{grid-template-columns:1fr 1fr}.lrow input:nth-child(3){grid-column:1/-1}}
/* Look: settings on the left, the real app in a phone on the right. */
.lookgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.lookcol{min-width:0}
.phonecol{position:sticky;top:80px}
.phone{width:min(380px,100%);height:760px;margin:0 auto;border-radius:46px;padding:10px;background:#0a0b0d;
  border:1px solid var(--brd2);box-shadow:0 40px 90px -40px rgba(0,0,0,.9),inset 0 0 0 2px #17191d}
.phone iframe{width:100%;height:100%;border:0;border-radius:36px;background:#000;display:block}
.pvbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
@media (max-width:1240px){.lookgrid{grid-template-columns:1fr}.phonecol{position:static;order:-1;margin-bottom:14px}
  .phone{height:640px}}
.dots{display:flex;flex-wrap:wrap;gap:10px}
.dots .dot{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--brd2);cursor:pointer;padding:0;
  transition:transform .15s,box-shadow .15s}
.dots .dot i{position:absolute;inset:9px;border-radius:50%}
.dots .dot:hover{transform:scale(1.08)}
.dots .dot.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.opts.wide{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.th.opt{padding:8px}
/* the kinds of opening screen: each tile plays a small copy of it, in the theme's colours */
.opts.spk{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.spv{position:relative;display:block;height:78px;border-radius:9px;overflow:hidden;margin-bottom:8px;background:var(--g,#0B0D12);border:1px solid rgba(255,255,255,.06)}
.spv i{position:absolute;display:block}
.spv .m{left:50%;top:15px;width:22px;height:22px;margin-left:-11px;border-radius:7px;background:var(--a);z-index:1}
.spv .n{left:50%;top:48px;width:46px;height:6px;margin-left:-23px;border-radius:3px;background:#E9ECF2}
.spv .l{left:50%;top:61px;width:32px;height:2px;margin-left:-16px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.spv .l::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:var(--a);animation:spvLoad 1.2s ease-in-out infinite}
.spv .f{left:50%;top:26px;width:0;height:0}
.spv .f::before,.spv .f::after{content:"";position:absolute}
@keyframes spvLoad{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
@keyframes spvSpin{to{transform:rotate(360deg)}}
.k-off .m,.k-off .n,.k-off .l,.k-off .f{display:none}
.k-off{background:linear-gradient(var(--c,#1A1D24),var(--c,#1A1D24)) 9px 10px/calc(100% - 18px) 24px no-repeat,
  linear-gradient(var(--c,#1A1D24),var(--c,#1A1D24)) 9px 40px/calc(50% - 12px) 28px no-repeat,
  linear-gradient(var(--c,#1A1D24),var(--c,#1A1D24)) calc(50% + 3px) 40px/calc(50% - 12px) 28px no-repeat,var(--g,#0B0D12)}
.k-auto .m{border-radius:50%;background:conic-gradient(from 30deg,var(--a),#5AB4FF,#FF4D5E,#FFD21F,var(--a));animation:spvAuto 3s ease-in-out infinite}
@keyframes spvAuto{50%{transform:rotate(180deg) scale(1.1);border-radius:6px}}
.k-pulse .f::before,.k-pulse .f::after{left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--a);animation:spvWave 1.8s ease-out infinite}
.k-pulse .f::after{animation-delay:.9s}
@keyframes spvWave{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
.k-orbit .n,.k-ring .n{top:52px}
.k-orbit .l,.k-ring .l{display:none}
.k-orbit .f{animation:spvSpin 1.3s cubic-bezier(.55,.15,.45,.85) infinite}
.k-orbit .f::before{left:-3px;top:-22px;width:6px;height:6px;border-radius:50%;background:var(--a);box-shadow:0 0 6px var(--a)}
.k-orbit .f::after{left:-2px;top:16px;width:4px;height:4px;border-radius:50%;background:var(--a);opacity:.6}
.k-ring .f::before{left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;background:conic-gradient(transparent 0 45%,var(--a));
  -webkit-mask:radial-gradient(circle,transparent 0 15.5px,#000 16px);mask:radial-gradient(circle,transparent 0 15.5px,#000 16px);animation:spvSpin .9s linear infinite}
.k-burst .m{animation:spvBurst 2.4s cubic-bezier(.34,1.56,.64,1) infinite}
.k-burst .f::before{left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;background:repeating-conic-gradient(var(--a) 0 4deg,transparent 4deg 20deg);
  -webkit-mask:radial-gradient(circle,transparent 0 40%,#000 41% 50%,transparent 51%);mask:radial-gradient(circle,transparent 0 40%,#000 41% 50%,transparent 51%);
  animation:spvRays 2.4s ease-out infinite}
.k-burst .n{animation:spvGather 2.4s ease-out infinite}
@keyframes spvBurst{0%{transform:scale(0) rotate(-40deg)}25%,100%{transform:none}}
@keyframes spvRays{0%,8%{transform:scale(.3);opacity:0}12%{opacity:1}45%,100%{transform:scale(1.2);opacity:0}}
@keyframes spvGather{0%,10%{transform:scaleX(1.6);opacity:0}40%,100%{transform:none;opacity:1}}
.k-type .m,.k-minimal .m{display:none}
.k-type .n{top:34px;left:calc(50% - 23px);margin:0;animation:spvType 2.6s steps(6,end) infinite}
.k-type .n::after{content:"";position:absolute;right:-5px;top:-2px;width:2px;height:10px;background:var(--a);animation:spvBlink .7s steps(1) infinite}
.k-type .l{display:none}
@keyframes spvType{0%{width:0}55%,100%{width:46px}}
@keyframes spvBlink{50%{opacity:0}}
.k-minimal .n{top:32px;animation:spvFade 2.4s ease infinite}
.k-minimal .l{top:46px;width:46px;margin-left:-23px}
@keyframes spvFade{0%{opacity:0}30%,100%{opacity:1}}
#spkHint b{color:var(--txt)}
.spv .m.lg{background-color:transparent;background-repeat:no-repeat;border-radius:3px;box-shadow:none}
.spv.k-auto .m.lg{animation:none}
.spv .m.lt{display:grid;place-items:center;font-weight:800;font-size:13px;line-height:1;color:var(--on,#fff)}
.spv.fl .n{background:#fff}
.spv:is(.k-off,.k-type,.k-minimal) .m{display:none}
.spv.nn:not(.k-type,.k-minimal) .n{display:none}
.spctl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 18px;margin-top:16px}
.spctl .field{margin-bottom:12px}
.spctl .tabs{flex-wrap:wrap}
.tabs button[disabled]{opacity:.35;cursor:not-allowed}
.spcol{display:flex;align-items:center;gap:8px;margin-top:8px}
.spcol input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--brd);border-radius:8px;background:none;cursor:pointer}
.spfit{margin:2px 0 14px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--brd);font-size:12.5px;line-height:1.55;color:var(--muted)}
.spfit b{color:var(--txt)}
.spfit .dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin:0 4px 0 1px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.th.opt .sw{height:54px}
.th.opt .icons{display:flex;gap:6px;margin:2px 0 8px;color:var(--txt)}
.th.opt .ico{display:grid;place-items:center;width:28px;height:28px}
.th.opt .ico.bd{border-radius:8px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.th.opt .ico.tl{border-radius:7px;color:#fff;background:var(--tl)}
.th.opt .ico.rg{border-radius:50%;color:var(--acc);border:1.5px solid color-mix(in srgb,var(--acc) 55%,transparent);box-sizing:border-box}
.lays{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.th.lay{display:block;padding:8px 8px 10px;text-align:left;align-self:stretch}
.lay .ph{display:block;height:128px;border-radius:9px;overflow:hidden;position:relative;margin-bottom:8px;border:1px solid var(--brd);background:#0b0b0c}
.lay .ph i{position:absolute;display:block}
.lay b{display:block;font-size:13px}
.lay small{display:block;font-size:11.5px;color:var(--muted2);margin-top:2px;line-height:1.35}
.dimmed{opacity:.45;pointer-events:none}
.fgroup{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--txt-3);margin:14px 0 8px}
.fgroup:first-child{margin-top:0}
.fcustom{display:flex;gap:8px;align-items:center;margin-top:8px}
.fcustom input{flex:1;min-width:0}
.fcustom .fs{font-size:22px;min-width:84px;text-align:center;color:var(--txt)}
.th.opt .ico.duo{border-radius:50%;color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.16),color-mix(in srgb,var(--acc) 14%,transparent) 60%);
  box-shadow:0 4px 12px -6px var(--acc)}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;margin-bottom:10px;
  border-top:1px solid var(--brd);border-bottom:1px solid var(--brd)}
.switchrow b{display:block;font-size:13.5px}
.switchrow span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.colorrow input[type=color]{width:46px !important;height:38px;padding:3px;border-radius:9px;border:1px solid var(--brd);background:var(--surface2);cursor:pointer;flex:none}
.logo b{font-size:14.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.logo span{display:block;font-size:10.5px;color:var(--muted)}
.nav{flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:8.5px 11px;border-radius:9px;color:var(--muted);
  font-weight:550;font-size:13.5px;cursor:pointer;transition:.13s;margin-bottom:1px;text-decoration:none}
.nav a:hover{background:var(--surface2);color:var(--txt)}
.nav a.on{background:var(--accent-weak);color:var(--txt)}
.nav a.on .ic{color:var(--accent)}
.nav a .cnt{margin-left:auto;font-size:10.5px;background:var(--danger);color:#fff;padding:1px 7px;border-radius:8px;font-weight:700}
.nav .sep{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted2);padding:13px 11px 5px;font-weight:700}
.langs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--brd);border-radius:10px;padding:3px;margin-top:10px}
.langs button{flex:1;border:none;background:none;color:var(--muted);font-weight:650;font-size:12px;padding:6px;border-radius:8px;cursor:pointer}
.langs button.on{background:var(--surface4);color:var(--txt)}
.who{display:flex;align-items:center;gap:10px;padding:9px;border:1px solid var(--brd);border-radius:11px;margin-top:10px}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--on-accent)}
.who .out{margin-left:auto;color:var(--muted2);cursor:pointer;padding:4px;border-radius:7px;background:none;border:0}
.who .out:hover{background:var(--surface3);color:var(--danger)}

/* ============ MAIN ============ */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--brd);padding:13px 24px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:18px;margin:0}
.topbar .crumb{font-size:11.5px;color:var(--muted);margin-top:2px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.content{padding:20px 24px 60px;flex:1}
#content>*{opacity:0;animation:pboot .38s cubic-bezier(.16,1,.3,1) forwards}
#content>*:nth-child(2){animation-delay:.05s}#content>*:nth-child(3){animation-delay:.09s}
#content>*:nth-child(n+4){animation-delay:.13s}
@keyframes pboot{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ LOGIN ============ */
.loginbox{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(6px)}
.lcard{width:340px;max-width:calc(100% - 32px);background:var(--surface);
  border:1px solid var(--brd);border-radius:16px;padding:22px;display:grid;gap:10px}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lhead .m{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent)}
.lhead b{display:block;font-family:var(--font-d);font-weight:500;font-size:15px}
.lhead span{font-size:12px;color:var(--muted)}
.lcard input{background:var(--bg);border:1px solid var(--brd);border-radius:10px;padding:11px 13px;color:var(--txt);font:inherit;font-size:14px}
.lcard input:focus{outline:none;border-color:var(--accent-brd)}
.lcard .btn{justify-content:center;padding:12px}
.lnote{min-height:17px;font-size:12.5px;color:var(--danger);text-align:center}
.lrule{font-size:11.5px;line-height:1.45;color:var(--muted2);border-top:1px solid var(--brd);padding-top:10px;margin-top:2px}

/* ============ UI ============ */
.btn{border:none;border-radius:9px;padding:9px 14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--on-accent);
  background:var(--accent);display:inline-flex;align-items:center;gap:7px;transition:filter .13s,transform .1s;white-space:nowrap;font-family:inherit}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;pointer-events:none}
a.btn{text-decoration:none}
details.foldbox{border:1px solid var(--brd);border-radius:11px;padding:11px 13px;margin:2px 0 12px;background:var(--surface2)}
details.foldbox summary{cursor:pointer;font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;list-style:none}
details.foldbox summary::-webkit-details-marker{display:none}
details.foldbox .field input,details.foldbox .field select{background:var(--surface)}
ol.how{margin:6px 0 10px;padding-left:18px;font-size:12.5px;line-height:1.5;color:var(--txt)}
ol.how li{margin-bottom:8px}
ol.how .keybox{margin-top:6px}
.btn.ghost{background:var(--surface2);border:1px solid var(--brd);color:var(--txt)}
.btn.ghost:hover{background:var(--surface3);filter:none}
.btn.sm{padding:6px 10px;font-size:12px}
.chrow{display:flex;gap:10px;align-items:flex-start;padding-top:4px}
.chrow .chn{width:22px;height:22px;flex:none;border-radius:50%;background:var(--surface2);border:1px solid var(--brd);
  display:grid;place-items:center;font-size:11px;color:var(--muted);margin-top:26px}
.iconbtn{flex:none;width:34px;height:34px;margin-top:22px;border-radius:9px;border:1px solid var(--brd);background:transparent;
  color:var(--muted);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{color:var(--danger);border-color:var(--danger)}
.btn.danger{background:var(--danger-weak);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff;filter:none}
.btn.ok{background:var(--ok-weak);color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--brd);border-radius:var(--r);padding:17px}
.card + .card{margin-top:14px}
.card h3{margin:0 0 14px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.card h3 .mini{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:auto}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}         /* a long address inside must not widen the column */
.g2{grid-template-columns:1.6fr 1fr}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;white-space:nowrap}
.tag .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.g{background:var(--ok-weak);color:var(--ok)}.tag.y{background:var(--warn-weak);color:var(--warn)}
.tag.r{background:var(--danger-weak);color:var(--danger)}.tag.m{background:var(--surface3);color:var(--muted)}
.tg{width:40px;height:23px;border-radius:20px;background:var(--surface3);border:1px solid var(--brd);position:relative;cursor:pointer;transition:.2s;flex:0 0 auto;padding:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#6b7280;transition:.2s}
.tg.on{background:var(--accent);border-color:transparent}.tg.on::after{left:19px;background:#fff}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted2);font-weight:700;padding:0 12px 10px;white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--brd);font-size:13.5px;vertical-align:middle}
table.tight th{padding:0 7px 10px}
table.tight td{padding:10px 7px}
table.tight th:first-child,table.tight td:first-child{padding-left:0}
table.tight th:last-child,table.tight td:last-child{padding-right:0}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0}
.inrow .btn{flex:none}
tbody tr:hover td{background:var(--surface2)}
tbody tr.click{cursor:pointer}
td.num,th.num{text-align:right}
.uname{font-weight:600}.usub{font-size:11px;color:var(--muted2);margin-top:1px}
.act{color:var(--muted);cursor:pointer;padding:6px;border-radius:7px;display:inline-flex;background:none;border:0}
.act:hover{background:var(--surface3);color:var(--txt)}
.act.dgr:hover{background:var(--danger-weak);color:var(--danger)}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field textarea,.field select{width:100%;background:var(--surface2);border:1px solid var(--brd);border-radius:9px;
  color:var(--txt);padding:10px 12px;font-size:13.5px;font-family:inherit;outline:none;transition:.13s}
.field textarea{min-height:90px;resize:vertical;line-height:1.5}
.field textarea.mono{font-size:12px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.field .hint,.hint{font-size:11px;color:var(--muted2);margin-top:5px;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.rowtg{display:flex;align-items:center;gap:14px;padding:12px 2px}.rowtg + .rowtg{border-top:1px solid var(--brd)}
.rowtg .rt{font-weight:600;font-size:13.5px}.rowtg .rs{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.4}
.rowtg .tg,.rowtg select{margin-left:auto}
.chks{display:grid;gap:6px}.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.tmrow{padding:12px 0;border-top:1px solid var(--brd)}.tmrow:first-of-type{border-top:0}
.tmh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.dgrow{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--brd)}
.dgrow:first-child{border-top:0}.dgrow .tag{justify-content:center}
.dgrow b{font-size:13.5px}.dgrow .usub{margin-top:2px;line-height:1.45;word-break:break-word}
.dgfix{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}.dgfix span{color:var(--txt);font-weight:600}
.bar{height:6px;border-radius:5px;background:var(--surface3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.copy{cursor:pointer;color:var(--muted);display:inline-flex;padding:3px;border-radius:5px;vertical-align:middle;background:none;border:0}
.copy:hover{color:var(--accent);background:var(--surface3)}
.filters{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--brd);
  border-radius:9px;padding:8px 11px;min-width:240px;color:var(--muted)}
.search input{border:none;background:none;color:var(--txt);outline:none;width:100%;font-size:13px;font-family:inherit}
.tabs{display:inline-flex;gap:3px;background:var(--surface2);border:1px solid var(--brd);border-radius:10px;padding:3px}
.tabs button{border:none;background:none;color:var(--muted);font-weight:600;font-size:12.5px;padding:7px 12px;
  border-radius:8px;cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--surface4);color:var(--txt)}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:14px;color:var(--muted);font-size:12.5px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:11px;margin-bottom:14px;font-size:13px;line-height:1.5}
.alert.r{background:var(--danger-weak);border:1px solid rgba(236,106,86,.35)}
.alert.y{background:var(--warn-weak);border:1px solid rgba(var(--accent-rgb),.35)}
.alert .ic{flex:none;margin-top:1px}
a.alert{color:var(--txt);text-decoration:none}a.alert:hover{border-color:var(--accent)}
.updcur{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px}
.rows .r{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--brd);font-size:13px}
.rows .r span{color:var(--muted)}.rows .r b{text-align:right;word-break:break-all}
.updv+.updv{margin-top:12px;padding-top:12px;border-top:1px solid var(--brd)}
.updh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}.updh span{color:var(--muted);font-size:12px}
.updv ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13px;line-height:1.45}
.updok{border-color:var(--ok);margin-bottom:14px}.updok h3{color:var(--ok)}
.updrun .ic{animation:spvSpin 1.4s linear infinite}
.updlog{margin:8px 0 0;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:11.5px;
  background:var(--surface2);border:1px solid var(--brd);border-radius:9px;padding:10px;color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
@media(min-width:1251px){.kpis.kpis5{grid-template-columns:repeat(5,1fr)}.kpis.kpis4{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--brd);border-radius:var(--r);padding:14px}
.kpi .top{display:flex;align-items:center;justify-content:space-between;color:var(--muted)}
.kpi .v{font-family:var(--font-d);font-weight:300;font-size:22px;margin:10px 0 3px;letter-spacing:-.01em;white-space:nowrap}
.kpi .l{font-size:11.5px;color:var(--muted)}
/* First steps after the install: one card, ticks come from real facts. */
.setup{padding:0;margin-bottom:14px;overflow:hidden;
  background:radial-gradient(520px 200px at 0% 0%,rgba(var(--accent-rgb),.08),transparent 70%),var(--surface)}
.setup .sh{display:flex;align-items:flex-end;gap:16px;padding:18px 18px 14px}
.setup .ey{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:700}
.setup h2{margin:5px 0 0;font-size:21px;font-weight:500}
.setup h2 i{font-style:normal;color:var(--accent)}
.setup .cnt{margin-left:auto;font-family:var(--font-d);font-weight:300;font-size:30px;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.setup .cnt small{font-family:var(--font-b);font-size:12px;color:var(--muted);letter-spacing:0;margin-left:4px}
.setup .prog{height:2px;background:var(--surface4)}
.setup .prog i{display:block;height:100%;background:var(--accent)}
.steps{margin:0;padding:0;list-style:none}
.step{display:grid;grid-template-columns:30px 1fr auto;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid var(--brd)}
.step:first-child{border-top:0}
.step .n{width:30px;height:30px;border-radius:50%;border:1px solid var(--brd2);display:grid;place-items:center;
  font-family:var(--font-d);font-size:12px;color:var(--muted)}
.step .n .ic{width:15px;height:15px}
.step.done .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step.next .n{border-color:var(--accent);color:var(--accent)}
.step b{display:block;font-size:13.5px;font-weight:600}
.step.done b{color:var(--muted);font-weight:500}
.step p{margin:3px 0 0;font-size:12px;color:var(--muted);line-height:1.45}
.step.done p{display:none}
.setup .foot{display:flex;justify-content:flex-end;padding:2px 12px 12px}
.setup .foot button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:6px 8px;border-radius:7px}
.setup .foot button:hover{color:var(--txt);background:var(--surface2)}
.card.setup{padding:0}
.step .go{justify-self:end}
.step .tagk{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted2);margin-left:6px}
.setup .more{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--brd);font-size:12.5px;color:var(--muted)}
.setup .more a{margin-left:auto;color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}
.setup.page{margin-bottom:14px}
.setup .ready{display:flex;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--brd);font-size:13px}
.setup .ready .ic{color:var(--ok)}
/* Choices shown as cards: the referral mode, the plan templates. */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.mode{border:1px solid var(--brd);border-radius:12px;padding:12px 13px;background:var(--surface2);cursor:pointer;text-align:left;color:var(--txt);font:inherit;display:flex;gap:11px;align-items:flex-start}
.mode:hover{border-color:var(--brd2)}
.mode.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mode .ic{color:var(--accent);margin-top:1px}
.mode b{display:block;font-size:13.5px}
.mode span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.pmrow{display:grid;grid-template-columns:156px minmax(0,1fr) minmax(0,1fr) auto auto;gap:8px;align-items:center;margin-bottom:8px}
.pmrow input,.pmrow select,.faqrow input,.faqrow textarea,.faqrow select,.tplrow input{width:100%;background:var(--surface2);border:1px solid var(--brd);border-radius:9px;padding:9px 10px;color:var(--txt);font:inherit;font-size:13px}
.pmrow .hintin{grid-column:2/4}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.faqrow{display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--brd)}
.faqrow:first-child{border-top:0;padding-top:0}
.faqrow .qa{display:grid;gap:6px}
.faqrow textarea{min-height:58px;resize:vertical;line-height:1.45}
.tplrow{display:grid;grid-template-columns:22px minmax(0,1fr) 84px 110px 90px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--brd)}
.tplrow.head{border-top:0;padding-top:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted2);font-weight:700}
.tplrow input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);margin:0}
.docgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.docgrid textarea{min-height:260px;font-size:12.5px}
.marks{font-size:11px;color:var(--muted2);line-height:1.6}
.marks code{background:var(--surface3);padding:1px 5px;border-radius:5px;color:var(--txt)}
.rec{font-size:11px;color:var(--muted);margin-top:4px}
.rec b{color:var(--accent);font-weight:600}
.money{font-family:var(--font-d);font-weight:300;letter-spacing:-.02em}
@media(max-width:760px){.modes,.docgrid{grid-template-columns:1fr}.pmrow{grid-template-columns:1fr 1fr}.pmrow .hintin{grid-column:1/-1}
  .tplrow{grid-template-columns:22px minmax(0,1fr) 70px 90px}.tplrow .dv{display:none}}
@media (max-width:700px){.step{grid-template-columns:30px 1fr;padding:13px 14px}.step .go{grid-column:2;justify-self:start}.setup .sh{padding:16px 14px 12px}.setup .cnt{font-size:24px}}

/* chart */
/* overview: trends, the revenue area, the plan ring, recent sales, server load */
.kpi .dl{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.kpi .dl.up{color:#34d399}.kpi .dl.down{color:#f87171}
.dash-a{grid-template-columns:1.6fr 1fr}.dash-b{grid-template-columns:1.25fr 1fr}
.dash-a > .card,.dash-b > .card{margin:0}
.area{position:relative;height:190px}
.area svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.area .gl{stroke:var(--brd);stroke-width:1;stroke-dasharray:3 5;vector-effect:non-scaling-stroke}
.area .pt{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.area.ghost svg,.area.ghost .pt,.ghostwrap .donut{opacity:.32;filter:grayscale(.6)}
.ghostwrap{position:relative}.ghostwrap .mid{visibility:hidden}
.ghostwrap .ghostnote{position:static;display:block;margin-top:14px;text-align:left;padding:0;font-weight:400;color:var(--muted);text-shadow:none}
.ghostnote{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:2;padding:0 20px;
  font-size:13px;color:var(--txt);font-weight:500;text-shadow:0 1px 8px var(--bg)}
.area .hits{position:absolute;inset:0;display:flex}.area .hits span{flex:1}
.area .hits span:hover{background:linear-gradient(transparent,color-mix(in srgb,var(--accent) 10%,transparent))}
.donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut .ring{position:relative;width:150px;height:150px;flex:none}.donut svg{width:100%;height:100%}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .mid b{font-family:var(--font-d);font-size:22px;font-weight:500}.donut .mid span{font-size:11px;color:var(--muted)}
.donut .legend{flex:1;min-width:150px;display:grid;gap:10px;font-size:13px}
.donut .legend div{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center}
.donut .legend i{width:10px;height:10px;border-radius:50%}.donut .legend span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sales{display:grid}.sale{display:grid;grid-template-columns:1.1fr 1.4fr auto auto;gap:12px;align-items:center;
  padding:11px 4px;border-top:1px solid var(--brd);font-size:13px;cursor:pointer}
.sale:first-child{border-top:0}.sale:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.sale b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sale span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sale strong{color:#34d399;text-align:right;white-space:nowrap}
.loads{display:grid}.ld{display:grid;grid-template-columns:auto 1fr auto 110px 40px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--brd);font-size:13px}
.ld:first-child{border-top:0}.ld .fl{font-size:16px}.ld b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ld .bar{height:6px;border-radius:4px;background:var(--brd);overflow:hidden}.ld .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ld .bar.y i{background:#fbbf24}.ld .bar.r i{background:#f87171}.ld .pc{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:900px){.dash-a,.dash-b{grid-template-columns:1fr}.sale{grid-template-columns:1fr auto auto}.sale span:not(.tag){display:none}
  .ld{grid-template-columns:auto 1fr 80px 36px}.ld .tag{display:none}}
.chart{display:flex;align-items:flex-end;gap:3px;height:170px;padding-top:6px}
.chart .b{flex:1;min-width:0;background:var(--accent);border-radius:3px 3px 0 0;opacity:.9;position:relative}
.chart .b.z{background:var(--surface3);height:2px !important;opacity:1}
.chart .b:hover{opacity:1;filter:brightness(1.15)}
.chart-x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted2);margin-top:7px}
.hbars{display:grid;gap:11px}
.funnel{display:grid;gap:12px}
.fn{display:grid;grid-template-columns:150px 1fr 110px;gap:12px;align-items:center}
.fn .fl b{display:block;font-size:13px;font-weight:600}.fn .fl span{display:block;font-size:11.5px;color:var(--muted)}
.fn .fb{height:26px;background:var(--surface2);border-radius:7px;overflow:hidden}
.fn .fb i{display:block;height:100%;background:var(--accent);border-radius:7px;opacity:.85}
.fn .fv{text-align:right}.fn .fv b{display:block;font-size:15px}.fn .fv span{font-size:11px;color:var(--muted)}
@media(max-width:700px){.fn{grid-template-columns:1fr 80px}.fn .fb{grid-column:1 / -1;grid-row:2}}
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:4px 2px}
.chat .m{max-width:86%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;
         word-wrap:break-word;background:var(--surface2);border:1px solid var(--brd)}
.chat .m .tx{white-space:pre-wrap}
.chat .m.me{align-self:flex-end;background:var(--accent-weak)}
.chat .m .mt{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.hbars .r{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:13px}
.hbars .r .bar{grid-column:1 / -1}

/* servers */
.srv{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.srv .fl{width:40px;height:40px;border-radius:11px;background:var(--surface2);border:1px solid var(--brd);display:grid;place-items:center;font-size:20px}
.srv .n{font-weight:600}.srv .u{font-size:11.5px;color:var(--muted2);margin-top:2px;word-break:break-all}
.srv .e{font-size:12px;color:var(--danger);margin-top:5px}
.srv .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ibs{display:grid;gap:6px;margin:6px 0 12px}
.ib{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--brd);border-radius:9px;cursor:pointer}
.ib input{accent-color:var(--accent);width:auto !important;flex:none;margin:0}
.ib span:first-of-type{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib .m{font-size:11.5px;color:var(--muted2);margin-left:auto}

/* MODAL / DRAWER */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:.2s;z-index:100;backdrop-filter:blur(2px)}
.ovl.show{opacity:1;pointer-events:auto}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%);width:520px;max-width:calc(100vw - 32px);
  max-height:90vh;overflow-y:auto;background:var(--surface);border:1px solid var(--brd2);border-radius:15px;padding:21px;
  z-index:101;opacity:0;pointer-events:none;transition:.2s}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.mh{display:flex;align-items:center;margin-bottom:15px}.mh h3{margin:0;font-size:16px}
.mh .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.x{margin-left:auto;color:var(--muted);cursor:pointer;padding:5px;border-radius:8px;background:none;border:0}.x:hover{background:var(--surface3);color:var(--txt)}
.mf{display:flex;gap:9px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.drawer{position:fixed;top:0;right:0;height:100vh;width:460px;max-width:94vw;background:var(--surface);
  border-left:1px solid var(--brd2);z-index:101;transform:translateX(100%);
  transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:21px}
.drawer.show{transform:translateX(0)}
.mini-stat{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0}
.mini-stat div{background:var(--surface2);border:1px solid var(--brd);border-radius:10px;padding:10px 11px}
.mini-stat b{display:block;font-size:15px;font-weight:700}.mini-stat span{font-size:10.5px;color:var(--muted)}
.sect{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted2);font-weight:700;margin:18px 0 8px}
.uava{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:700;color:var(--on-accent);font-size:17px;flex:none}
.acts-grid{display:flex;gap:7px;flex-wrap:wrap}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--brd)}
.hrow:last-child{border-bottom:0}
.hrow span:first-child{color:var(--muted2)}
.keybox{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--bg);border:1px solid var(--brd);
  border-radius:9px;padding:10px 11px;color:var(--muted);word-break:break-all;display:flex;gap:8px;align-items:center}
.keybox span{flex:1;min-width:0;word-break:normal;overflow-wrap:anywhere}   /* commands break at spaces, links anywhere */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--surface4);
  border:1px solid var(--brd2);padding:11px 17px;border-radius:11px;font-size:13px;font-weight:600;opacity:0;
  pointer-events:none;transition:.25s;z-index:300;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{border-color:rgba(236,106,86,.6)}
.logline{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;padding:6px 0;border-bottom:1px solid var(--brd);display:flex;gap:11px;color:var(--muted)}
.logline .lt{color:var(--muted2);flex:0 0 auto}
.logline .lv{flex:0 0 44px;font-weight:700}
.logline .la{color:var(--txt);flex:0 0 auto}
.logline .ld{overflow:hidden;text-overflow:ellipsis}
.lv.info{color:var(--accent)}.lv.warn{color:var(--warn)}.lv.error{color:var(--danger)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ic{width:38px;height:38px;margin:0 auto 12px;color:var(--muted2)}
.review{padding:13px 0;border-top:1px solid var(--brd)}
.review:first-child{border-top:0}
.review .s{color:var(--accent);letter-spacing:1px}
.review p{margin:6px 0 9px;color:var(--muted);line-height:1.5}

@media(max-width:1250px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.side{width:58px;flex-basis:58px}.logo div,.nav a span.tx,.nav .sep,.who .info,.langs{display:none}
  .nav a{justify-content:center}.kpis{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}
  .content{padding:16px}.topbar{padding:12px 16px}.two,.three{grid-template-columns:1fr}}
.trig{padding:14px 0;border-top:1px solid var(--brd)}
.trig:first-of-type{border-top:0}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:4px}
.burger{display:none;background:none;border:1px solid var(--brd);color:var(--txt);border-radius:9px;
  width:36px;height:36px;place-items:center;cursor:pointer;flex:none}
.navveil{display:none}
/* Phone (the panel opened from the bot): the menu slides in from the left,
   tables and tabs scroll inside themselves, nothing widens the page. */
@media(max-width:640px){
  .burger{display:grid}
  /* iPhone zooms into a field with text under 16px and leaves the page
     zoomed and shifted sideways: fields are 16px on a phone */
  input:not([type=checkbox]):not([type=radio]):not([type=color]),select,textarea{font-size:16px !important}
  .side{position:fixed;left:0;top:0;bottom:0;height:100%;width:252px;flex-basis:auto;z-index:130;
    transform:translateX(-104%);transition:transform .22s cubic-bezier(.16,1,.3,1);border-right:1px solid var(--brd)}
  .logo div,.nav a span.tx,.nav .sep,.who .info,.langs{display:revert}
  .logo div{display:block}.nav a{justify-content:flex-start}.langs{display:flex}.who .info{display:block}
  body.navopen .side{transform:none}
  body.navopen .navveil{display:block;position:fixed;inset:0;z-index:125;background:rgba(0,0,0,.55)}
  .topbar{padding:10px 12px;gap:10px;flex-wrap:wrap}
  .topbar .tt{flex:1;min-width:0}
  .topbar h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-right{margin-left:0;width:100%;flex-wrap:wrap}
  .tb-right:empty{display:none}
  .content{padding:12px 12px 60px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .filters>*{max-width:100%}
  .search{width:100%}
  .tabs{display:flex;max-width:100%;overflow-x:auto;scrollbar-width:none}
  .tabs button{white-space:nowrap;flex:none}
  .card{padding:14px;overflow:hidden}
  .modal{max-height:calc(100vh - 24px);overflow-y:auto}
  .drawer{width:100vw;max-width:100vw}
  /* a server card: its buttons go under it, in a row that wraps */
  .srv{grid-template-columns:auto 1fr}
  .srv .acts{grid-column:1 / -1;justify-content:flex-start}
  .field select,.field input,.field textarea{max-width:100%}
  select{max-width:100%}
  .rowtg:has(> select){flex-wrap:wrap}.rowtg > select{flex:1 1 100%;min-width:0}
}
</style>

const ic = (n, cls = "s") => `<svg class="ic ${cls}"><use href="#${n}"/></svg>`;

const money = v => Number(v || 0).toLocaleString(LANG === "ru" ? "ru-RU" : "en-US",
  { maximumFractionDigits: 2 }) + "\u00A0" + CUR.symbol;
const GB = 1073741824;
const gbf = b => (b / GB).toLocaleString(LANG === "ru" ? "ru-RU" : "en-US", { maximumFractionDigits: 1 }) + " GB";
const date = ts => ts ? new Date(ts * 1000).toLocaleDateString(LANG === "ru" ? "ru-RU" : "en-US",
  { day:"2-digit", month:"2-digit", year:"2-digit" }) : "—";
const dtime = ts => ts ? new Date(ts * 1000).toLocaleString(LANG === "ru" ? "ru-RU" : "en-US",
  { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }) : "—";
function ago(ts){
  if (!ts) return "—";
  const s = Date.now() / 1000 - ts;
  if (s < 60) return t("justNow");
  if (s < 3600) return t("minAgo", { n:Math.floor(s / 60) });
  if (s < 86400) return t("hoursAgo", { n:Math.floor(s / 3600) });
  const d = Math.floor(s / 86400);
  return d === 1 ? t("yesterday") : t("daysAgo", { n:d });
}

/* ============================ API ============================ */
let TOKEN = "";
try { TOKEN = sessionStorage.getItem("kn_admin") || ""; } catch (e) {}
/* A page asks for its data, the admin clicks to another page meanwhile:
   the late answer must not draw the old page over the new one. */
let ROUTE_SEQ = 0;
class Stale extends Error {}
async function api(path, { method = "GET", body = null } = {}){
  const seq = ROUTE_SEQ;
  const headers = { "Accept":"application/json" };
  if (body) headers["Content-Type"] = "application/json";
  if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
  const r = await fetch("/api/admin" + path, { method, headers, body: body ? JSON.stringify(body) : null });
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (r.status === 401 && path !== "/login"){ showLogin(); throw new Error(t("badLogin")); }
  if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : (data.detail ? JSON.stringify(data.detail) : t("error") + " " + r.status));
  if (method === "GET" && seq !== ROUTE_SEQ) throw new Stale("stale");
  return data;
}
function fail(e){ if (e instanceof Stale) return; toast(e.message || t("error"), true); }

function showLogin(){
  TOKEN = ""; WHO = null; try { sessionStorage.removeItem("kn_admin"); } catch (e) {}
  $("loginBox").hidden = false; $("loginPass").focus();
}
async function doLogin(){
  $("loginNote").textContent = "";
  try {
    const r = await fetch("/api/admin/login", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ login:$("loginUser").value, password:$("loginPass").value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(r.status === 401 ? t("badLogin") : (d.detail || t("error")));
    TOKEN = d.token; WHO = null; try { sessionStorage.setItem("kn_admin", TOKEN); } catch (e) {}
    $("loginBox").hidden = true; $("loginPass").value = "";
    $("whoName").textContent = $("loginUser").value;
    route();
  } catch (e){ $("loginNote").textContent = e.message; }
}
function logout(){
  // The server forgets this token too: a copy of it stops working at once.
  if (TOKEN) fetch("/api/admin/logout", { method:"POST", headers:{ "Authorization":"Bearer " + TOKEN } }).catch(() => {});
  showLogin();
}

];
let page = "dash", badges = {};
/* Which section each page belongs to: a team member sees only theirs (the
   server checks it too, for every request — this only tidies the menu). */
const PAGE_SECTION = { dash:"stats", setup:"stats", stats:"stats", orders:"sales", sources:"sales", plans:"sales",
  warm:"sales", promos:"sales", gifts:"sales", users:"people", refs:"people", casts:"people", reviews:"people",
  support:"support", servers:"system", look:"system", docs:"system", settings:"system", alarm:"system",
  logs:"system", team:"owner" };
let WHO = null;
function pageAllowed(id){
  if (!WHO || WHO.owner) return true;
  const sec = PAGE_SECTION[id] || "owner";
  return sec !== "owner" && WHO.sections.includes(sec);
}
async function loadWho(){ try { WHO = await api("/me"); } catch (e){ WHO = { owner:false, sections:[] }; } }
function drawNav(){
  const keep = PAGES.filter(([id]) => id === "sep" || pageAllowed(id));
  const vis = keep.filter((p, i) => p[0] !== "sep" || (keep[i + 1] && keep[i + 1][0] !== "sep"));
  $("nav").innerHTML = vis.map(([id, x]) => id === "sep" ? `<div class="sep">${esc(t(x))}</div>`
    : `<a href="#${id}" class="${page === id ? "on" : ""}">${ic(x, "")}<span class="tx">${esc(t(id))}</span>${
        badges[id] ? `<span class="cnt">${badges[id]}</span>` : ""}</a>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
}
function setLang(l){ LANG = l; try { localStorage.setItem("kn_admin_lang", l); } catch (e) {} applyStatic(); route(); }
function applyStatic(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = t(el.dataset.ph));
  document.querySelectorAll("[data-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.aria)));
}
function head(title, sub, right){
  $("pgTitle").textContent = title; $("pgSub").textContent = sub || ""; $("tbRight").innerHTML = right || "";
  document.title = title + " · Admin";
}
function toggleNav(on){
  document.body.classList.toggle("navopen", on === undefined ? !document.body.classList.contains("navopen") : on);
}
function route(){
  ROUTE_SEQ++;
  toggleNav(false);
  page = (location.hash || "#dash").slice(1).split("?")[0];
  if (!PAGES.some(p => p[0] === page)) page = "dash";
  if (!TOKEN){ drawNav(); showLogin(); return; }
  if (!WHO){ const seq = ROUTE_SEQ; loadWho().then(() => { if (seq === ROUTE_SEQ) route(); }); return; }
  if (!pageAllowed(page)){
    const first = PAGES.find(([id]) => id !== "sep" && pageAllowed(id));
    if (first && first[0] !== page){ location.hash = "#" + first[0]; return; }
    drawNav(); $("content").innerHTML = `<div class="empty" style="padding:40px">${esc(t("noSection"))}</div>`; return;
  }
  drawNav();
  closeAll();
  $("content").innerHTML = "";
  ({ dash:pDash, users:pUsers, orders:pOrders, plans:pPlans, promos:pPromos, gifts:pGifts, servers:pServers,
     casts:pCasts, reviews:pReviews, look:pLook, settings:pSettings, logs:pLogs, warm:pWarm, refs:pRefs,
     stats:pStats, support:pSupport, setup:pSetup, docs:pDocs, sources:pSources, alarm:pAlarm, team:pTeam, pay:pPay,
     updates:pUpdates }[page])();
}

/* Inside Telegram the panel is a mini app, where window.confirm may not show
   at all (the answer is then "no"): Telegram's own dialog is used there. */
function ask(text){
  const w = window.Telegram && window.Telegram.WebApp;
  if (w && w.initData && w.showConfirm && w.isVersionAtLeast && w.isVersionAtLeast("6.2"))
    return new Promise(res => { try { w.showConfirm(String(text).slice(0, 4096), ok => res(!!ok)); } catch (e){ res(window.confirm(text)); } });
  return Promise.resolve(window.confirm(text));
}

/* Revenue by day as a smooth area: the line, a soft fill under it, a dot on
   the last day; every day can be hovered for its sum. */
function areaChart(days){
  // No sales yet: a pale sample curve with a note, so the card shows what will be there.
  const empty = !days.some(x => x.amount > 0);
  if (empty) days = days.map((x, i) => ({ day:x.day, amount:40 + 28 * Math.sin(i / 3.1) + 18 * Math.sin(i / 1.7 + 1) + i * 2.2 }));
  const W = 600, H = 190, P = 6, n = days.length, max = Math.max(1, ...days.map(x => x.amount));
  const X = i => P + i * (W - 2 * P) / Math.max(1, n - 1), Y = v => H - P - v / max * (H - 2 * P - 10);
  const pts = days.map((x, i) => [X(i), Y(x.amount)]);
  let line = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++){
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2;
    line += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`;
  }
  const area = `${line} L${pts[n - 1][0]},${H} L${pts[0][0]},${H} Z`;
  const last = pts[n - 1];
  return `<div class="area${empty ? " ghost" : ""}">${empty ? `<div class="ghostnote">${esc(t("ghostRevenue"))}</div>` : ""}<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(t("revenue"))}">
      <defs><linearGradient id="arF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".34"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      ${[0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${W}" y1="${(H * f).toFixed(1)}" y2="${(H * f).toFixed(1)}" class="gl"/>`).join("")}
      <path d="${area}" fill="url(#arF)"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    </svg>
    <i class="pt" style="left:${(last[0] / W * 100).toFixed(2)}%;top:${(last[1] / H * 100).toFixed(2)}%"></i>
    ${empty ? "" : `<div class="hits">${days.map(x => `<span title="${esc(x.day)}: ${esc(money(x.amount))}"></span>`).join("")}</div>`}</div>
    <div class="chart-x"><span>${esc(days[0].day.slice(5))}</span><span>${esc(days[Math.floor(n / 2)].day.slice(5))}</span><span>${esc(days[n - 1].day.slice(5))}</span></div>`;
}
/* Active subscriptions by plan: a ring with the total in the middle. */
const DONUT = ["var(--accent)", "#34d399", "#60a5fa", "#f472b6", "#a78bfa", "#2dd4bf", "#94a3b8"];
function donut(plans, total){
  const R = 52, C = 2 * Math.PI * R;
  let at = 0;
  const top = plans.slice(0, 6), rest = plans.slice(6).reduce((a, p) => a + p.count, 0);
  const parts = rest ? top.concat([{ name:t("otherPlans"), count:rest }]) : top;
  const arcs = parts.map((p, i) => {
    const len = p.count / total * C, gap = parts.length > 1 ? Math.min(3, len / 3) : 0;
    const el = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${DONUT[i % DONUT.length]}" stroke-width="16"
      stroke-dasharray="${Math.max(0, len - gap).toFixed(2)} ${(C - Math.max(0, len - gap)).toFixed(2)}" stroke-dashoffset="${(-at).toFixed(2)}"/>`;
    at += len;
    return el;
  }).join("");
  return `<div class="donut"><div class="ring"><svg viewBox="0 0 140 140" style="transform:rotate(-90deg)">
      <circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--brd)" stroke-width="16"/>${arcs}</svg>
      <div class="mid"><b>${total.toLocaleString()}</b><span>${esc(t("kActiveShort"))}</span></div></div>
    <div class="legend">${parts.map((p, i) => `<div><i style="background:${DONUT[i % DONUT.length]}"></i><span>${esc(p.name)}</span><b>${(p.count / total * 100).toFixed(0)}%</b></div>`).join("")}</div></div>`;
}

/* «Мой налог» receipts. An uncertain one is never resent by the shop:
   the admin looks in the app and says what is there. */
const RC_TAG = { pending:["m", "rcPending"], sending:["y", "rcSending"], sent:["g", "rcSent"], failed:["r", "rcFailed"],
                 uncertain:["y", "rcUncertain"], skipped:["m", "rcSkipped"] };
async function receiptsList(){
  let d;
  try { d = await api("/receipts?limit=300"); } catch (e){ return fail(e); }
  badges.receipts = (d.counts.uncertain || 0) + (d.counts.failed || 0);
  const box = $("olist");
  if (!d.on && !d.items.length){ box.innerHTML = `<div class="alert y" style="margin:8px 10px">${ic("i-alert")}<span>${esc(t("rcOff"))}</span></div>`; return; }
  const gws = d.gateways.map(g => PAY_NAMES[g] || g).join(", ");
  box.innerHTML = (!d.on ? `<div class="alert y" style="margin:8px 10px">${ic("i-alert")}<span>${esc(t("rcOff"))}</span></div>` : "")
    + (d.paused ? `<div class="alert r" style="margin:8px 10px">${ic("i-alert")}<span>${esc(t("rcPaused"))}</span></div>` : "")
    + (d.counts.uncertain ? `<div class="alert y" style="margin:8px 10px">${ic("i-alert")}<span>${esc(t("rcUncertainN"))}</span></div>` : "")
    + (d.items.length ? `<div class="tblwrap"><table><thead><tr><th>${esc(t("rcOrder"))}</th><th>${esc(t("oDate"))}</th>
    <th class="num">${esc(t("oAmount"))}</th><th>${esc(t("rcLine"))}</th><th>${esc(t("oStatus"))}</th><th></th></tr></thead><tbody>
    ${d.items.map(r => { const m = RC_TAG[r.status] || ["m", r.status];
      return `<tr><td class="mono">#${r.tx_id}</td><td>${dtime(r.paid_at || r.created_at)}</td><td class="num">${money(r.amount)}</td>
      <td style="max-width:260px">${esc(r.name)}</td>
      <td><span class="tag ${m[0]}">${esc(t(m[1]))}</span>${r.uuid ? (r.url ? ` <a class="usub" href="${esc(r.url)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(t("rcOpen"))}</a>` : ` <span class="usub mono">${esc(r.uuid)}</span>`) : ""}
        ${r.error && r.status !== "sent" ? `<div class="usub" title="${esc(r.error)}" style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.error)}</div>` : ""}</td>
      <td style="white-space:nowrap">${r.status === "failed" ? `<button class="btn ok sm" onclick="rcRetry(${r.id},this)">${esc(t("rcRetry"))}</button>` : ""}
        ${r.status === "uncertain" ? `<button class="btn ok sm" onclick="rcResolve(${r.id},'sent',this)">${esc(t("rcFound"))}</button>
          <button class="btn ghost sm" onclick="rcResolve(${r.id},'pending',this)">${esc(t("rcMissing"))}</button>` : ""}
        ${r.status === "skipped" ? `<button class="btn ghost sm" onclick="rcResolve(${r.id},'send',this)">${esc(t("rcSend"))}</button>` : ""}
        ${["uncertain", "failed", "pending"].includes(r.status) ? `<button class="btn ghost sm" onclick="rcResolve(${r.id},'skipped',this)">${esc(t("rcSkip"))}</button>` : ""}</td></tr>`; }).join("")}
    </tbody></table></div>` : `<div class="empty">${ic("i-doc", "")}${esc(t("rcNone", { g:gws }))}</div>`);
}
async function rcRetry(id, btn){
  btn.disabled = true;
  try { await api(`/receipts/${id}/retry`, { method:"POST" }); toast(t("done")); receiptsList(); }
  catch (e){ fail(e); btn.disabled = false; }
}
async function rcResolve(id, status, btn){
  let uuid = "";
  if (status === "sent"){ const v = window.prompt(t("rcUuidQ"), ""); if (v === null) return; uuid = v.trim(); }
  else if (status === "send"){ if (!(await ask(t("rcSendQ")))) return; status = "pending"; }
  else if (!(await ask(t(status === "pending" ? "rcMissingQ" : "rcSkipQ")))) return;
  btn.disabled = true;
  try { await api(`/receipts/${id}/resolve`, { method:"POST", body:{ status, uuid } }); toast(t("done")); receiptsList(); }
  catch (e){ fail(e); btn.disabled = false; }
}
async function checkNalog(btn){
  btn.disabled = true;
  try {
    const r = await api("/receipts/check", { method:"POST" });
    $("rcRes").textContent = t(r.resumed ? "rcResumed" : "rcCheckOk"); $("rcRes").style.color = "var(--ok)";
  } catch (e){ $("rcRes").textContent = e.message || String(e); $("rcRes").style.color = "var(--danger)"; }
  finally { btn.disabled = false; }
}

async function syncServer(id, btn){
  if (!(await ask(t("syncAllQ")))) return;
  btn.disabled = true;
  const label = btn.innerHTML;
  try {
    let r = await api(`/servers/${id}/sync`, { method:"POST" });
    // Runs on the server in the background; show progress on the button.
    while (r.running){
      btn.textContent = r.total ? `${r.done} / ${r.total}` : t("checking");
      await new Promise(res => setTimeout(res, 1500));
      r = await api(`/servers/${id}/sync`);

/* The panel's subscription address is only for 3x-ui 2.x, which logs in with
   a password; 3.x (an API token, or a check that found 3.x) builds links itself. */
let SVER = "";
function subField(){
  const f = $("fSub");
  if (!f) return;
  const v3 = SVER.startsWith("3") || !!val("sToken") || !!$("sToken").dataset.has;
  f.hidden = SKIND !== "3xui" || v3;
}
/* 3x-ui, Marzban or Remnawave. Marzban has no API token and names inbounds
   by tags; Remnawave takes an API token and gives access by internal squads;
   neither needs a separate subscription address. */
let SKIND = "3xui";
function setKind(k, first){
  SKIND = k;
  document.querySelectorAll("#sKind button").forEach(b => b.classList.toggle("on", b.dataset.k === k));
  const mz = k === "marzban", rw = k === "remnawave";
  $("fToken").hidden = mz; subField();
  $("lUrl").textContent = t(mz ? "panelUrlMz" : rw ? "panelUrlRw" : "panelUrl");
  $("hUrl").textContent = t(mz ? "panelUrlHintMz" : rw ? "panelUrlHintRw" : "panelUrlHint");
  $("lToken").textContent = t(rw ? "apiTokenRw" : "apiToken");
  $("hToken").textContent = t(rw ? "apiTokenHintRw" : "apiTokenHint");
  $("lInb").textContent = t(rw ? "squads" : "inbounds");
  $("lTgInb").textContent = t(rw ? "tgInbRw" : "tgInb");
  $("hInb").textContent = t(mz ? "inboundsHintMz" : rw ? "inboundsHintRw" : "inboundsHint");
  $("sUrl").placeholder = mz ? "https://panel.example.com:8000/" : rw ? "https://panel.example.com/" : "https://panel.example.com:2053/secret/";
  $("sInb").placeholder = t("inbPh");
  if (!first){ $("sIbs").innerHTML = ""; $("sTest").textContent = ""; }
}
const panelLabel = (kind, v) => {
  v = String(v || "");
  if (kind === "marzban" || v.startsWith("m")) return "Marzban " + v.replace(/^m/, "");
  if (kind === "remnawave" || v.startsWith("r")) return ("Remnawave " + v.replace(/^r/, "")).trim();
  return "3x-ui " + v;
};
/* The speed-up command, with this shop's own address: the script is served
   by the shop, no GitHub needed. */
/* "inbounds: 2" / "squads: 1" — the ids themselves (UUIDs for Remnawave)
   say nothing on a card. */
function inbSummary(s){
  const n = String(s.inbound_ids || "").split(",").filter(x => x.trim()).length;
  return n ? t(s.kind === "remnawave" ? "squadsN" : "inbN", { n }) : t("noInb");
}
/* Who took the money, in words: "stars" and "gift" are codes, not names. */
const PAY_NAMES = { stars:"Stars", yookassa:"ЮKassa", freekassa:"FreeKassa", platega:"Platega", paypalych:"Pally",
                    rollypay:"RollyPay", cispay:"cisPay", lava:"Lava", wata:"WATA", cryptobot:"Crypto Pay", heleket:"Heleket",
                    tribute:"Tribute", cloudpayments:"CloudPayments", mulenpay:"MulenPay", lavepay:"Lave Pay" };
function payName(o){

function setRefMode(m){
  REF.mode = m;

  $("refDays").hidden = m !== "days"; $("refMoney").hidden = m !== "money"; $("pmCard").hidden = m !== "money";
  if (m === "money") $("poCard").hidden = false;
}
function drawPm(){
  const box = $("pmList");
  if (!box) return;
  box.innerHTML = PM.length ? PM.map((m, i) => `<div class="pmrow">
      <select onchange="PM[${i}].kind=this.value;drawPm()">${Object.entries(PM_KINDS).map(([k, [l]]) => `<option value="${k}" ${m.kind === k ? "selected" : ""}>${esc(t(l))}</option>`).join("")}</select>

      <input value="${esc(m.en)}" maxlength="40" placeholder="${esc(t("pmTitleEn"))}" oninput="PM[${i}].en=this.value">
      <button type="button" class="tg ${m.on !== false ? "on" : ""}" onclick="this.classList.toggle('on');PM[${i}].on=this.classList.contains('on')" aria-label="on"></button>
      <button class="act dgr" onclick="PM.splice(${i},1);drawPm()" aria-label="${esc(t("delete"))}">${ic("i-trash")}</button>
      ${m.kind === "other" ? `<input class="hintin" value="${esc(m.hint_ru || "")}" maxlength="80" placeholder="${esc(t("pmHintPh"))}" oninput="PM[${i}].hint_ru=this.value;PM[${i}].hint_en=PM[${i}].hint_en||this.value">`

function pmAdd(k){
  if (PM.length >= 8) return toast(t("pmMax"), true);
  PM.push({ ...PM_PRESETS[k], on:true });
  drawPm();
}
function drawPayouts(){
  const box = $("poList");
  if (!box) return;
  document.querySelectorAll("#poCard .tabs button").forEach((b, i) => b.classList.toggle("on", (i === 0) === (PO_FILTER === "pending")));
  const rows = PAYOUTS.filter(p => !PO_FILTER || p.status === PO_FILTER);
  const st = { pending:["y", "poSPending"], paid:["g", "poSPaid"], rejected:["r", "poSRejected"], cancelled:["m", "poSCancelled"] };
  box.innerHTML = rows.length ? `<div class="tblwrap"><table><thead><tr><th>${esc(t("oDate"))}</th><th>${esc(t("oUser"))}</th>
      <th class="num">${esc(t("oAmount"))}</th><th>${esc(t("poWhere"))}</th><th>${esc(t("status"))}</th><th></th></tr></thead><tbody>
    ${rows.map(p => `<tr><td><div>${esc(dtime(p.created_at))}</div><div class="usub">#${p.id}</div></td>
      <td><a class="uname" href="#" onclick="event.preventDefault();userCard(${p.tg_id})" style="color:var(--txt);text-decoration:none">${esc(p.first_name || "—")}</a>
        <div class="usub">${p.username ? "@" + esc(p.username) + " · " : ""}${p.tg_id}</div></td>
      <td class="num"><b>${money(p.amount)}</b></td>
      <td><div>${esc(p.method)}</div><div class="usub mono" style="font-size:11.5px;white-space:nowrap">${esc(p.details)}
        <button class="copy" onclick="copy('${jsq(p.details)}')" aria-label="copy">${ic("i-copy", "xs")}</button></div></td>
      <td><span class="tag ${st[p.status][0]}">${esc(t(st[p.status][1]))}</span>${p.note ? `<div class="usub">${esc(p.note)}</div>` : ""}</td>

        <button class="btn danger sm" onclick="payoutReject(${p.id}, this)">${esc(t("reject"))}</button>` : ""}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty" style="padding:20px">${esc(PO_FILTER ? t("poNoneWaiting") : t("poNone"))}</div>`;

async function payoutPaid(id, btn){
  const p = PAYOUTS.find(x => x.id === id);
  if (!(await ask(t("poPaidQ", { a:money(p.amount), d:p.details })))) return;
  btn.disabled = true;
  try { await api(`/payouts/${id}/paid`, { method:"POST" }); toast(t("done")); pRefs(); }
  catch (e){ fail(e); btn.disabled = false; }
}
async function payoutReject(id, btn){
  const note = window.prompt(t("poRejectQ"), "");
  if (note === null) return;
  btn.disabled = true;
  try { await api(`/payouts/${id}/reject`, { method:"POST", body:{ note } }); toast(t("done")); pRefs(); }
  catch (e){ fail(e); btn.disabled = false; }
}
async function saveRefs(btn){
  const body = { ref_mode:REF.mode };
  document.querySelectorAll("[data-rk]").forEach(el => body[el.dataset.rk] = el.value);
  document.querySelectorAll("[data-rsw]").forEach(el => body[el.dataset.rsw] = el.classList.contains("on") ? "1" : "0");
  const bad = PM.find(m => !(m.ru || "").trim());
  if (bad) return toast(t("pmNeedTitle"), true);
  body.ref_payout_methods = JSON.stringify(PM);
  if (REF.mode === "money" && body.ref_enabled === "1" && !PM.some(m => m.on !== false)
      && !(await ask(t("pmNoneQ")))) return;
  btn.disabled = true;
  try { await api("/settings", { method:"POST", body }); toast(t("saved")); pRefs(); }
  catch (e){ fail(e); } finally { btn.disabled = false; }
}

function fontLoad(f){
  if (!f.load || document.querySelector(`link[data-font="${f.id}"]`)) return;
  const l = document.createElement("link");
  l.rel = "stylesheet"; l.dataset.font = f.id;
  l.href = `https://fonts.googleapis.com/css2?${f.load}&display=swap`;
  document.head.appendChild(l);
}
const FONT_GROUPS = [["sans", "fkSans"], ["serif", "fkSerif"], ["char", "fkChar"], ["fun", "fkFun"]];
function drawFonts(){
  LOOK.fonts.forEach(fontLoad);
  if (LOOK.fontCustom) customFontLoad(LOOK.fontCustom);
  const tile = f => `<button class="th fnt ${LOOK.font === f.id ? "on" : ""}" onclick="LOOK.font='${f.id}';drawFonts();lookChanged()"${f.app_only ? ` title="${esc(t("fOnlyApp"))}"` : ""}>
    <span class="fs" style="font-family:'${esc(f.d)}',system-ui">Аа 365</span>
    <b>${esc(f.name)}</b></button>`;
  $("fontGrid").innerHTML = FONT_GROUPS.map(([k, l]) => {
    const list = LOOK.fonts.filter(f => (f.kind || "sans") === k);
    return list.length ? `<div class="fgroup">${esc(t(l))}</div><div class="fonts">${list.map(tile).join("")}</div>` : "";
  }).join("") + `<div class="fgroup">${esc(t("fkCustom"))}</div>
    <div class="fcustom field" style="margin-bottom:0"><button class="th fnt ${LOOK.font === "custom" ? "on" : ""}" style="flex:none;padding:8px 12px" onclick="useCustomFont()">
      <span class="fs" id="fcSample" style="margin:0;font-family:${LOOK.fontCustom ? `'${esc(LOOK.fontCustom)}',` : ""}system-ui">Аа 365</span></button>
      <input id="fcName" maxlength="40" placeholder="${esc(t("fCustomPh"))}" value="${esc(LOOK.fontCustom)}" oninput="customFontTyped(this.value)"></div>
    <div class="hint" id="fcHint" style="margin-top:6px">${esc(t("fCustomHint"))}</div>`;
}
const cfLoads = {};
function customFontLoad(name){            // resolves once the stylesheet has come (or failed)
  if (!name) return Promise.resolve();
  if (cfLoads[name]) return cfLoads[name];
  return (cfLoads[name] = new Promise(done => {
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.dataset.cfont = name;
    l.onload = l.onerror = () => done();
    l.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(name).replace(/%20/g, "+")}&display=swap`;
    document.head.appendChild(l);
  }));
}
let cfTimer = null;
function customFontTyped(v){
  LOOK.fontCustom = v.replace(/\s+/g, " ").trim();
  clearTimeout(cfTimer);
  cfTimer = setTimeout(async () => {
    const name = LOOK.fontCustom, sample = $("fcSample"), hint = $("fcHint");
    if (!sample) return;
    hint.textContent = t("fCustomHint"); hint.style.color = "";
    if (!/^[A-Za-z0-9][A-Za-z0-9 ]{0,39}$/.test(name)) return;
    await customFontLoad(name);
    if (name !== LOOK.fontCustom) return;
    sample.style.fontFamily = `'${name}',system-ui`;
    let ok = false;
    try { ok = (await document.fonts.load(`22px '${name}'`, "Аа")).length > 0; } catch (e){}
    if (name !== LOOK.fontCustom) return;
    if (!ok){ hint.textContent = t("fCustomBad"); hint.style.color = "var(--warn, #E5A13A)"; return; }
    if (LOOK.font === "custom") lookChanged();
  }, 500);
}
function useCustomFont(){
  if (!LOOK.fontCustom){ toast(t("fCustomEmpty"), true); $("fcName") && $("fcName").focus(); return; }
  LOOK.font = "custom"; drawFonts(); lookChanged();
}

/* ---- the live preview: the real mini app in a phone, with unsaved settings */
let frameReady = false;
function frameSay(msg){
  const f = $("lkFrame");
  if (f && f.contentWindow) f.contentWindow.postMessage(msg, location.origin);
}
function pvPick(box, btn){ document.querySelectorAll(`#${box} button`).forEach(b => b.classList.toggle("on", b === btn)); }
window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== "kv-ready") return;
  frameReady = true;
  pushLook(true);
});
let lookTimer = null, lastLook = null;
function pushLook(now){
  clearTimeout(lookTimer);
  lookTimer = setTimeout(async () => {
    if (!LOOK || !$("lkFrame")) return;
    const body = { theme_preset:LOOK.preset, theme_accent:LOOK.accent, theme_surface:LOOK.surface,
                   font:LOOK.font, font_custom:LOOK.fontCustom, radius:LOOK.radius, icons:LOOK.icons, backdrop:LOOK.backdrop, layout:LOOK.layout,
                   motion:LOOK.motion, effect:LOOK.effect, cards:LOOK.cards, splash_kind:LOOK.splashKind };
    const replay = !!LOOK.replay; LOOK.replay = false;
    let pv;
    try { pv = await api("/theme/preview", { method:"POST", body }); } catch (e){ return; }
    lastLook = pv;
    frameSay({ type:"kv-look", ...pv, name:($("lkName") && $("lkName").value.trim()) || "VPN", logo:LOOK.logo || "",
               splash_text:{ ru:$("spRu") ? $("spRu").value.trim() : "", en:$("spEn") ? $("spEn").value.trim() : "" },
               splash_cfg:{ ...LOOK.sp }, logo_info:LOOK.logoInfo || null, replay });

// The colour is built by hand: an accent and a dark background. The dots
// are only shortcuts that fill both in (a matching pair keeps its hand-picked tones).
function drawThemes(){
  $("themeGrid").innerHTML = LOOK.presets.map(p => `<button class="dot ${LOOK.preset === p.id ? "on" : ""}" onclick="pickTheme('${p.id}')"
      title="${esc(p.accent)}" aria-label="${esc(p.accent)}" style="background:${p.ground}"><i style="background:${p.accent}"></i></button>`).join("");
  if ($("accIn")) $("accIn").value = LOOK.accent;

function matchPreset(){

}
function pickTheme(id){

function exPeriod(k){

function exPick(){
  const k = $("exP").value, own = k === "own";

async function exportGo(what, btn, toTg){
  let q = `lang=${LANG}`;
  if (what === "orders"){
    const a = $("exA").value, b = $("exB").value;
    if (a && b && a > b) return toast(t("exBadPeriod"), true);
    q += `&start=${a}&end=${b}&status=${$("exAll").classList.contains("on") ? "all" : "paid"}`;
  }
  btn.disabled = true;
  try {
    if (toTg){
      await api(`/${what}/export/send?${q}`, { method:"POST" });
      toast(t("exSent")); closeAll();
    } else {
      const r = await fetch(`/api/admin/${what}/export?${q}`, { headers:{ Authorization:"Bearer " + TOKEN } });
      if (!r.ok) throw new Error(((await r.json().catch(() => ({}))).detail) || t("error") + " " + r.status);
      const name = ((r.headers.get("Content-Disposition") || "").match(/filename="([^"]+)"/) || [])[1] || what + ".xlsx";
      const url = URL.createObjectURL(await r.blob());
      const el = document.createElement("a"); el.href = url; el.download = name; document.body.appendChild(el); el.click(); el.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      closeAll();

}

          ? `<button class="btn" id="updGo" onclick="updRun(this)" ${busy || queued ? "disabled" : ""}>${ic("i-upload", "xs")}${esc(t("updNow", { v:d.latest }))}</button>`
          : `<div class="hint">${esc(t("updByHand"))}</div><div class="keybox" style="margin-top:6px"><span class="mono">vpn-seller update</span><button class="copy" onclick="copy('vpn-seller update')">${ic("i-copy", "xs")}</button></div>`}</div>
        <div class="hint" style="margin-top:10px">${esc(t("updSafe"))}</div>
      </div>` : ""}
    </div><div>
      <div class="card"><h3>${esc(t("updAutoT"))}</h3>
        <div class="rowtg"><div><div class="rt">${esc(t("updAuto"))}</div><div class="rs">${esc(t("updAutoN"))}</div></div>
          <button type="button" class="tg ${d.auto ? "on" : ""}" id="updAutoOn" onclick="this.classList.toggle('on');updAuto()" ${d.updater ? "" : "disabled"}></button></div>
        <div class="field" style="margin-top:12px"><label>${esc(t("updHour"))}</label>
          <select id="updHour" onchange="updAuto()" ${d.updater ? "" : "disabled"}>${hours}</select>
          <div class="hint">${esc(t("updHourN", { now:d.server_time }))}</div></div>
        ${d.updater ? "" : `<div class="hint">${esc(t("updAutoNeeds"))}</div>`}
      </div>
      <div class="card"><h3>${esc(t("updHowT"))}</h3><div class="hint" style="margin:0">${esc(t("updHow"))}</div></div>
      ${st && st.log ? `<details class="foldbox" style="margin-top:14px"><summary>${esc(t("updLog"))} · ${esc(dtime(st.at))}</summary><pre class="updlog mono">${esc(st.log)}</pre></details>` : ""}
    </div></div>`;
  clearTimeout(UPD_POLL);
  if (busy || queued) UPD_POLL = setTimeout(updPoll, 3000);
}
async function updPoll(){
  if (page !== "updates") return;
  let d;
  try { d = await api("/updates"); }
  catch (e){                                   // the shop is restarting: keep asking
    const box = document.querySelector(".updrun span");
    if (box) box.innerHTML = `<b>${esc(t("updRestart"))}</b><br>${esc(t("updRunningN"))}`;
    UPD_POLL = setTimeout(updPoll, 3000);
    return;
  }
  if (UPD_FROM && d.current !== UPD_FROM){ toast(t("updDone", { v:d.current })); setTimeout(() => location.reload(), 1200); return; }
  drawUpdates(d);
}
async function updCheck(btn){
  btn.disabled = true;
  try { const d = await api("/updates/check", { method:"POST" }); drawUpdates(d);
    toast(d.error ? t("updErrShort") : d.available ? t("updAvail", { v:d.latest }) : t("updLatest"), !!d.error); }
  catch (e){ fail(e); } finally { btn.disabled = false; }
}
async function updRun(btn){
  if (!(await ask(t("updAsk", { v:UPD.latest })))) return;
  btn.disabled = true;
  try { drawUpdates(await api("/updates/run", { method:"POST" })); toast(t("updStarted")); }
  catch (e){ fail(e); btn.disabled = false; }
}
async function updAuto(){
  try { const d = await api("/updates/auto", { method:"POST", body:{ auto:$("updAutoOn").classList.contains("on"), hour:Number($("updHour").value) } });
    UPD = d; toast(t("saved")); }
  catch (e){ fail(e); }
}
// The overview: one line when a new version is out (the owner only).
async function dashUpdate(){
  if (!WHO || !WHO.owner) return;
  let d;
  try { d = await api("/updates"); } catch (e){ return; }
  badges.updates = d.available ? 1 : 0; drawNav();
  const box = $("dashUpd");
  if (!box) return;
  if (d.available) box.innerHTML = `<a class="alert y" href="#updates" style="text-decoration:none">${ic("i-upload")}<span><b>${esc(t("updAvail", { v:d.latest }))}</b> · ${esc(t("updDashN"))} →</span></a>`;
  else if (d.fresh.length) box.innerHTML = `<a class="alert y" href="#updates" style="text-decoration:none">${ic("i-check2")}<span><b>${esc(t("updDone", { v:d.current }))}</b> · ${esc(t("updDashFresh"))} →</span></a>`;
}

/* ============================ log ============================ */
let lLevel = "";
async function pLogs(){
  head(t("logs"), t("logsSub"), `<button class="btn ghost sm" onclick="pLogs()">${ic("i-refresh", "xs")}${esc(t("refresh"))}</button>`);
  let d;
  try { d = await api("/logs?limit=400&level=" + lLevel); } catch (e){ return fail(e); }
  $("content").innerHTML = `<div class="filters"><div class="tabs">${[["", "lAll"], ["warn", "lWarn"], ["error", "lErr"]].map(([k, l]) =>
    `<button class="${lLevel === k ? "on" : ""}" onclick="lLevel='${k}';pLogs()">${esc(t(l))}</button>`).join("")}</div></div>
    <div class="card">${d.length ? d.map(r => `<div class="logline"><span class="lt">${dtime(r.at)}</span>
      <span class="lv ${esc(r.level)}">${esc(r.level)}</span><span class="la">${esc(r.action)}</span>
      <span class="lt">${esc(r.actor)}</span><span class="ld" title="${esc(r.details)}">${esc(r.details)}</span></div>`).join("")
      : `<div class="empty">${ic("i-list", "")}${esc(t("noLog"))}</div>`}</div>`;
}

/* ============================ start ============================ */
async function loadBrand(){
  try { const c = await (await fetch("/api/app/config")).json(); $("brandName").textContent = c.brand; CUR = { symbol:c.symbol, currency:c.currency }; } catch (e) {}
}
/* Inside Telegram (from /admin in the bot): the signature of Telegram
   proves the admin, no password needed. Outside — the usual login. */
async function telegramLogin(){
  const w = window.Telegram && window.Telegram.WebApp;
  if (!w || !w.initData) return false;
  try { w.ready(); w.expand(); w.setHeaderColor((window.KV_BRAND || {}).ground || "#000000"); } catch (e) {}
  // Came from the mini app: Telegram's Back returns to it.
  let fromApp = false; try { fromApp = sessionStorage.getItem("kv_from_app") === "1"; } catch (e) {}
  try { if (fromApp){ w.BackButton.show(); w.BackButton.onClick(() => { location.href = "/app"; }); } } catch (e) {}
  try {
    const r = await fetch("/api/admin/tg-login", { method:"POST", headers:{ "X-Init-Data":w.initData } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return false;
    TOKEN = d.token; try { sessionStorage.setItem("kn_admin", TOKEN); } catch (e) {}
    $("whoName").textContent = d.name || "admin";
    return true;
  } catch (e){ return false; }
}
applyStatic();
if (window.KV_BRAND){ $("brandName").textContent = KV_BRAND.brand || "VPN"; if (KV_BRAND.logo) setBrandMarks(KV_BRAND.logo); }
loadBrand();
(async () => {
  if (!TOKEN) await telegramLogin();
  if (!TOKEN) showLogin();
  route();
})();
</script>
