/* ---- numbers roll to a new value instead of swapping ----
   SEEN holds what the person last saw. A change made while its screen is
   hidden (the purchase overlay is up, another tab is open) waits: the old
   value stays, and it rolls when the screen is shown again. */
const SEEN = {}, ROLLS = {};
let HELD = false;                        // a number waits behind the opening screen or an overlay
function showNum(key, el, to, fmt){
  if (!el) return false;
  const r = ROLLS[key], now = performance.now();
  const seen = el.closest(".screen.on") && $("done").hidden && !document.documentElement.classList.contains("splashing");
  // a roll in flight survives a redraw: it carries on in the new element
  if (r && now - r.start < r.ms){
    if (r.to === to){ rollNum(key, el, r.from, to, fmt, r.start); return false; }
    const cur = r.from + (r.to - r.from) * ease((now - r.start) / r.ms);
    delete ROLLS[key];
    SEEN[key] = to % 1 ? Math.round(cur * 100) / 100 : Math.round(cur);
  }
  const from = SEEN[key];
  if (from == null || from === to || MOTION() !== "lively" || !entered){ SEEN[key] = to; return false; }
  if (!seen){ el.innerHTML = fmt(from); HELD = true; return false; }
  SEEN[key] = to;
  rollNum(key, el, from, to, fmt, now);
  return true;
}
const ease = k => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
function rollNum(key, el, from, to, fmt, start, ms = 720){
  const frac = to % 1 !== 0, run = { from, to, start, ms, el };
  ROLLS[key] = run;
  el.classList.add("rolling");
  const step = now => {
    if (!el.isConnected || ROLLS[key] !== run) return;
    const k = (now - start) / ms, v = from + (to - from) * ease(k);
    el.innerHTML = fmt(k < 1 ? (frac ? Math.round(v * 100) / 100 : Math.round(v)) : to);
    if (k < 1) requestAnimationFrame(step); else { el.classList.remove("rolling"); delete ROLLS[key]; }
  };
  el.innerHTML = fmt(frac ? Math.round(from * 100) / 100 : Math.round(from));
  requestAnimationFrame(step);
}
/* the screen became visible: what changed behind it rolls now */
function catchUp(){
  if (!ready) return;
  HELD = false;
  if (tab === "home") drawHome();
  else if (tab === "devs") drawDevs();
}

/* ---- a row leaves: it closes its own room, then the list is drawn ---- */
function rowOut(el){
  if (!el || MOTION() === "off") return Promise.resolve();
  el.style.height = el.offsetHeight + "px";
  void el.offsetHeight;
  el.classList.add("row-out");
  el.style.height = "0px";
  return new Promise(res => setTimeout(res, MOTION() === "calm" ? 200 : 340));
}

function countUp(el, ms, delay){
  const to = parseInt(el.dataset.count, 10);
  if (!(to > 1)) return;
  const keep = el.innerHTML.replace(/^\d+/, "");
  el.textContent = "0";
  const start = performance.now() + delay;
  const step = now => {
    const k = Math.min(1, Math.max(0, (now - start) / ms));
    const eased = 1 - Math.pow(1 - k, 3);
    el.innerHTML = Math.round(to * eased) + keep;
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ============================ seasonal effect ============================ */
let fxRun = 0;
function startFx(){
  const run = ++fxRun, cv = $("fx"), ctx = cv.getContext && cv.getContext("2d");
  if (!ctx) return;
  const kind = document.documentElement.getAttribute("data-effect");
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (kind !== "snow" || MOTION() === "off") return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  let W = 0, H = 0;
  const size = () => { W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr;
                       cv.style.width = W + "px"; cv.style.height = H + "px"; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  size(); addEventListener("resize", size);
  const flakes = Array.from({ length:42 }, () => ({ x:Math.random() * W, y:Math.random() * H,
    r:.8 + Math.random() * 1.9, v:.25 + Math.random() * .6, w:Math.random() * 6.28, s:.4 + Math.random() * .8 }));
  const tick = () => {
    if (run !== fxRun) return;
    if (document.visibilityState === "visible"){
      const light = document.documentElement.getAttribute("data-theme") === "light";
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = light ? "rgba(120,130,150,.45)" : "rgba(255,255,255,.75)";
      for (const f of flakes){
        f.y += f.v; f.w += .012; f.x += Math.sin(f.w) * .35 * f.s;
        if (f.y > H + 4){ f.y = -4; f.x = Math.random() * W; }
        ctx.globalAlpha = .35 + f.r / 4;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

    $("splash").classList.add("out");
    enter();
    setTimeout(() => { if (n !== replayN) return; root.classList.remove("splashing"); $("splash").classList.remove("out"); if (HELD) catchUp(); }, 560);
  }, min - (performance.now() - t0));
}
if (PREVIEW){
  window.addEventListener("message", e => {
    if (e.origin !== location.origin) return;
    const m = e.data || {};
    if (m.type === "kv-look"){ applyLook(m); if (m.replay) replaySplash(); }
    else if (m.type === "kv-splash") replaySplash();
    else if (m.type === "kv-done") celebrate(t("doneTitle"), t("subActive"));
    else if (m.type === "kv-scheme"){ THEME_PREF = m.value; applyTheme(); startFx(); }
    else if (m.type === "kv-state"){ PREVIEW_STATE = m.value; ME = m.value === "new" ? null : demoMe(); drawAll(); }
    else if (m.type === "kv-tab") go(m.value);
  });
  try { window.parent.postMessage({ type:"kv-ready" }, location.origin); } catch (e) {}
}

/* ============================ 3D and neon icons ============================ */
/* With data-icons="3d" (drawn, c-*), "neon" (glowing pictures, n-*),
   "pixel" (8-bit pixel art, p-*), "comic" (stickers, x-*), "ornament" (festive
   things: a snow globe, a snowman..., o-*) or "fortune" (red diamonds, f-*) the
   line icons in icon places are swapped for those sets. New content is
   handled as it appears; switching (the live preview) restores the lines
   first. */
(function(){
  const HAS = new Set(["home","globe","dev","wallet","user","ref","shield","bolt","star","card","coin","search",
    "gift","qr","help","chat","list","copy","trash","down","doc","friends","send","tag","link","key"]);
  const SET = { "3d":"c-", neon:"n-", pixel:"p-", comic:"x-", ornament:"o-", fortune:"f-" };
  // Arcade also redraws the small one-colour signs (arrows, cross, plus,
  // the brand shield) and the icons inside buttons as pixel glyphs.
  const MONO = new Set(["chev","arr","close","plus","minus","check","shield","copy","ref","trash","send","star","bolt"]);
  // .stars: the rating is told by colour (chosen / not), a colour picture would light all five
  const SKIP = ".btn,.chip,.sheet-x,.stepper,.promo,.chat-in,.banner,.deal,.brand,#splash,.emb,.stars";
  const root = document.documentElement;
  const pre = () => SET[root.getAttribute("data-icons")] || "";
  function apply(scope){
    const want = pre();
    const list = scope.tagName === "use" ? [scope] : scope.querySelectorAll ? scope.querySelectorAll("use") : [];
    for (const u of list){
      // the drawings of the sets themselves hold line icons (baubles, diamonds): never swap those
      if (u.closest("symbol")) continue;
      const s = u.ownerSVGElement; if (!s) continue;
      let h = u.getAttribute("href") || "";
      const m = /^#(c|n|p|q|x|o|f)-(.+)$/.exec(h);
      if (m && (m[1] + "-") !== want && !(m[1] === "q" && want === "p-")){   // another set: back to the line icon
        h = "#i-" + m[2]; u.setAttribute("href", h); s.classList.remove("c3d", "c-" + m[2], "pxg");
      }
      if (want && h.startsWith("#i-")){
        const name = h.slice(3);
        if (HAS.has(name) && !s.closest(SKIP)){
          u.setAttribute("href", "#" + want + name);
          s.classList.add("c3d", "c-" + name);
        } else if (want === "p-" && MONO.has(name)){
          u.setAttribute("href", "#q-" + name);
          s.classList.add("pxg");
        }
      }
    }
  }
  window.icons3d = () => apply(document);
  new MutationObserver(ms => {
    if (!pre()) return;
    for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) apply(n);
  }).observe(document.body, { childList:true, subtree:true });
  new MutationObserver(() => apply(document)).observe(root, { attributes:true, attributeFilter:["data-icons"] });
  apply(document);
})();

/* ============================ glass: the touch light ============================ */
/* With glass cards a soft light follows the finger over a card, and the
   main card and the tiles lean a little toward it. Only when motion is
   lively; read from the attributes each time, so the live preview works. */
(function(){
  const LIT = ".card,.tile,.plan,.pay", TILT = ".hero,.tile";
  const on = () => { const d = document.documentElement;
    return ["glass", "neon"].includes(d.getAttribute("data-cards")) && d.getAttribute("data-motion") === "lively"; };
  let cur = null;
  function move(e){
    if (!on()) return;
    const el = e.target.closest && e.target.closest(LIT);
    if (cur && cur !== el) leave();
    if (!el) return;
    cur = el;
    const r = el.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    el.style.setProperty("--mx", x + "px"); el.style.setProperty("--my", y + "px");
    el.classList.add("lit");
    if (el.matches(TILT)){
      const rx = (0.5 - y / r.height) * 5, ry = (x / r.width - 0.5) * 6;
      const press = e.buttons || e.pointerType === "touch" ? " scale(.985)" : "";
      el.style.transform = `perspective(700px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)${press}`;
    }
  }
  function leave(){
    if (!cur) return;
    cur.classList.remove("lit"); cur.style.transform = "";
    cur = null;
  }
  document.addEventListener("pointerdown", move, { passive:true });
  document.addEventListener("pointermove", move, { passive:true });
  ["pointerup", "pointercancel", "scroll"].forEach(ev => document.addEventListener(ev, () => setTimeout(leave, 120), { passive:true, capture:true }));
  document.addEventListener("pointerleave", leave, { passive:true });
})();

applyTheme();
applyStaticTexts();
drawNav();
drawSkeleton();
// Without the opening screen the app comes in at once, showing the shapes
// of what is loading; with it, it comes in when the data is there.
if (!document.documentElement.classList.contains("splashing")) afterViewport(enter);
startFx();
loadAll();
</script>
</body>
</html>
